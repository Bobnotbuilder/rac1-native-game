name: iOS native port contracts
on:
  push:
    branches: [ios/arm64-metal-port]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  apple-runtime:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Private preparation metadata contracts (no disc)
        run: python3 -m unittest discover -s tests/apple -p 'test_*.py' -v
      - name: Record source and SDK
        run: |
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/source.txt
          uname -m | tee evidence/host-architecture.txt
          xcodebuild -version | tee evidence/xcode.txt
          xcrun --sdk iphoneos --show-sdk-version | tee evidence/device-sdk.txt
      - name: Build and run native ARM64 coroutine and FP contracts
        run: |
          cmake -S ios/portability -B build-apple -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-apple --parallel 2 2>&1 | tee evidence/apple-build.log
          ctest --test-dir build-apple --output-on-failure 2>&1 | tee evidence/apple-tests.log
          build-apple/rac1_vu0_simd_test | tee evidence/vu0-neon-reference.log
          # Measured with this fixture on the untouched upstream SSE path (Intel, strict FP).
          grep -q 'VU0_SIMD_REFERENCE_DIGEST=806184f7d1d9edb5' evidence/vu0-neon-reference.log
      - name: Compile actual iPhone ARM64 runtime objects
        run: |
          # Makefiles compile static archives, not a signed Xcode app. Do not pass an ignored signing variable.
          cmake -S ios/portability -B build-device -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-device --parallel 2 2>&1 | tee evidence/device-build.log
          file build-device/librac1_apple_runtime.a | tee evidence/device-library.txt
          lipo -verify_arch arm64 build-device/librac1_apple_runtime.a
          lipo -verify_arch arm64 build-device/librac1_metal_state.a
          lipo -verify_arch arm64 build-device/librac1_metal_texture.a
          lipo -verify_arch arm64 build-device/librac1_metal_scene.a
          file build-device/librac1_metal_state.a | tee evidence/device-metal-state.txt
          xcrun ar -t build-device/librac1_apple_runtime.a | tee evidence/device-objects.txt
      - name: Compile Metal for device and run source-derived contracts on host GPU
        run: |
          xcodebuild -downloadComponent MetalToolchain
          if xcrun --sdk iphoneos metal -c tests/apple/unsupported_fp64.metal -o build-device/unsupported.air > evidence/metal-fp64-negative.log 2>&1; then
            echo "Metal FP64 support changed; review the tfrag capability gate"
            exit 1
          fi
          grep -q "'double' is not supported in Metal" evidence/metal-fp64-negative.log
          xcrun --sdk iphoneos metal -fno-fast-math -c src/game/render/metal/gs_fragment.metal -o build-device/gs_fragment.air
          xcrun --sdk iphoneos metallib build-device/gs_fragment.air -o build-device/gs_fragment.metallib
          xcrun --sdk macosx metal -fno-fast-math -c src/game/render/metal/gs_fragment.metal -o build-apple/gs_fragment.air
          xcrun --sdk macosx metallib build-apple/gs_fragment.air -o build-apple/gs_fragment.metallib
          build-apple/rac1_metal_contract build-apple/gs_fragment.metallib 2>&1 | tee evidence/metal-tests.log
          xcrun --sdk iphoneos metal -fno-fast-math -c tests/apple/gs_blend_fixture.metal -o build-device/gs_blend_fixture.air
          xcrun --sdk iphoneos metallib build-device/gs_blend_fixture.air -o build-device/gs_blend_fixture.metallib
          xcrun --sdk macosx metal -fno-fast-math -c tests/apple/gs_blend_fixture.metal -o build-apple/gs_blend_fixture.air
          xcrun --sdk macosx metallib build-apple/gs_blend_fixture.air -o build-apple/gs_blend_fixture.metallib
          build-apple/rac1_metal_blend_contract build-apple/gs_blend_fixture.metallib 2>&1 | tee evidence/metal-blend-tests.log
          xcrun --sdk iphoneos metal -fno-fast-math -c tests/apple/gs_programmable_fixture.metal -o build-device/gs_programmable.air
          xcrun --sdk iphoneos metallib build-device/gs_programmable.air -o build-device/gs_programmable.metallib
          xcrun --sdk macosx metal -fno-fast-math -c tests/apple/gs_programmable_fixture.metal -o build-apple/gs_programmable.air
          xcrun --sdk macosx metallib build-apple/gs_programmable.air -o build-apple/gs_programmable.metallib
          build-apple/rac1_programmable_blend_contract build-apple/gs_programmable.metallib 2>&1 | tee evidence/metal-programmable-tests.log
          xcrun --sdk iphoneos metal -fno-fast-math -c src/game/render/metal/gs_scene.metal -o build-device/gs_scene.air
          xcrun --sdk iphoneos metallib build-device/gs_scene.air -o build-device/gs_scene.metallib
          xcrun --sdk macosx metal -fno-fast-math -c src/game/render/metal/gs_scene.metal -o build-apple/gs_scene.air
          xcrun --sdk macosx metallib build-apple/gs_scene.air -o build-apple/gs_scene.metallib
          build-apple/rac1_gs_scene_metal_contract build-apple/gs_scene.metallib 2>&1 | tee evidence/metal-scene-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RAC1Native-Apple-port-contract-evidence
          path: evidence/
          if-no-files-found: error
